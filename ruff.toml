# Shared ruff config for every Brutus service (lint + format).
target-version = "py315"
line-length = 88
extend-exclude = [".venv"]

[lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "C4",            # comprehensions
    "D",             # docstrings
    "UP",            # pyupgrade
    "SIM",           # simplify
    "PTH",           # use pathlib
    "RUF",           # ruff-specific
]
ignore = ["D105", "D107", "D203", "D213", "D401"]  # D401: noun-phrase docstrings read better for pure functions

[lint.per-file-ignores]
"**/tests/**" = ["D"]

[lint.isort]
known-first-party = ["brutus"]
