[project]
name = "brutus-backend"
version = "2.0.0"
description = "Backend for B.R.U.T.U.S."
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.44.9",
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[polly,rekognition]>=1.44.9",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
]

[tool.uv]
package = false

[tool.taskipy.tasks]
start = "uvicorn api:app --host 0.0.0.0 --port 8000"
dev = "uvicorn api:app --host 127.0.0.1 --port 8000 --reload"
test = "pytest -v"
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
check = "mypy ."

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: calls real AWS services",
    "unit: fast tests without external services",
]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
