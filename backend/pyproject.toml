[project]
name = "brutus-backend"
version = "2.0.0"
description = "Backend for B.R.U.T.U.S."
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "boto3>=1.44.9",
    "fastapi>=0.165.0",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
brutus-analyze = "brutus.cli:main"

[dependency-groups]
dev = [
    "boto3-stubs[polly,rekognition]>=1.44.9",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brutus"

[tool.taskipy.tasks]
start = "uvicorn brutus.api:create_app --factory --host 0.0.0.0 --port 8000"
dev = "uvicorn brutus.api:create_app --factory --host 127.0.0.1 --port 8000 --reload"
test = "pytest -m 'not integration'"
test-integration = "pytest -m integration"
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
check = "mypy src tests"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "integration: calls real AWS services (needs AWS SSO login)",
]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
