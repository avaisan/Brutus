[project]
name = "brutus-pi-client"
version = "2.0.0"
description = "Raspberry Pi terminal client that takes pictures and plays audio for B.R.U.T.U.S."
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "pillow>=13.0.0",
    "pygame-ce>=2.5.8",
    "python-dotenv>=1.2.4",
    "python-json-logger>=4.2.0",
    "requests>=2.34.2",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "requests-mock>=1.12.1",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
    "types-requests>=2.32",
]

[tool.uv]
package = false

[tool.taskipy.tasks]
start = "python brutus_pi.py"
dev = "python brutus_pi.py"
test = "pytest -v"
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
check = "mypy ."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true
