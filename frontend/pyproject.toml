[project]
name = "brutus-frontend"
version = "2.0.0"
description = "Frontend for B.R.U.T.U.S.: server-rendered results page refreshed with htmx"
license = "MIT"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "httpx2>=2.16.2",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.3",
    "python-json-logger>=4.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
    "taskipy>=1.14.1",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "brutus_frontend"

[tool.taskipy.tasks]
start = "uvicorn brutus_frontend.app:create_app --factory --log-config logging.json --host 0.0.0.0 --port 3000"
dev = "uvicorn brutus_frontend.app:create_app --factory --log-config logging.json --host 127.0.0.1 --port 3000 --reload"
test = "pytest"
lint = "ruff check . && ruff format --check ."
format = "ruff format . && ruff check --fix ."
check = "mypy src tests"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]
